[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation system for answering questions about vLLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.2.13",
    "fire>=0.7.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "tqdm>=4.66.0",
    "transformers>=4.45.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[project.scripts]
student = "student.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    ".venv",
    "data",
    "datasets_public",
    "moulinette",
    "vllm-0.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
